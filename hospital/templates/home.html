
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Hospital Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #123456;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 6%;
            background: white;
            box-shadow: 0 2px 5px #ddd;
        }

        .nav-title {
            color: #087e83;
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links a {
            color: #123456;
            text-decoration: none;
            margin-left: 20px;
        }

        .nav-links a:hover {
            color: #087e83;
        }

        .hero {
            display: flex;
            align-items: center;
            min-height: 550px;
            padding-left: 6%;
        }

        .content {
            width: 45%;
            padding-right: 30px;
        }

        .content h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        .content p {
            color: #666;
            font-size: 18px;
            line-height: 1.7;
        }

        .button {
            display: inline-block;
            background: #087e83;
            color: white;
            padding: 14px 25px;
            margin-top: 25px;
            border-radius: 30px;
            text-decoration: none;
        }

        .button:hover {
            background: #065f63;
        }

        .hero img {
            width: 55%;
            height: 550px;
            object-fit: cover;
            border-radius: 40px 0 0 0;
        }

        @media (max-width: 700px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                text-align: center;
            }

            .nav-links a {
                display: inline-block;
                margin: 8px;
            }

            .hero {
                flex-direction: column;
                padding: 30px 20px;
            }

            .content {
                width: 100%;
                padding: 20px 0;
            }

            .content h1 {
                font-size: 32px;
            }

            .hero img {
                width: 100%;
                height: 300px;
                border-radius: 20px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="nav-title">Hospital Care</div>

        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'category_list' %}">Departments</a>
            <a href="{% url 'doctor_list' %}">Doctors</a>
            <a href="/admin/">Admin</a>
        </div>
    </nav>

    <div class="hero">

        <div class="content">
            <h1>Quality Healthcare for Everyone</h1>

            <p>
                Find doctors and explore available
                appointments with ease.
            </p>

            <a href="{% url 'doctor_list' %}" class="button">
                View Doctors &rarr;
            </a>
        </div>

        <img src="{% static 'images/hero-alt-2.jpg' %}"
     alt="Hospital">
    </div>

</body>
</html>
```
