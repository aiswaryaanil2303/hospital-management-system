
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login | Hospital</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f6fc;
            color: #183153;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: white;
            padding: 20px 7%;
            box-shadow: 0 2px 10px rgba(20, 65, 110, 0.08);
        }

        header a {
            color: #1266d4;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 16px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #e0eaf5;
            box-shadow: 0 10px 30px rgba(20, 65, 110, 0.08);
        }

        .icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #e8f2ff;
            color: #1266d4;
            font-size: 27px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d4e0ee;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #1266d4;
            box-shadow: 0 0 0 3px #e8f2ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1266d4;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d52ad;
        }

        .messages {
            background: #fff0f0;
            color: #b42318;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .patient-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #718096;
        }

        .patient-link a {
            color: #1266d4;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #718096;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="{% url 'home' %}">← Back to Home</a>
    </header>

    <main>
        <section class="login-card">
            <div class="icon">✚</div>
            <h1>Doctor Login</h1>
            <p class="subtitle">Sign in to manage your appointments and prescriptions.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="messages">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>
            </form>

            <div class="patient-link">
                Patient? <a href="{% url 'patient_login' %}">Login here</a>
            </div>
        </section>
    </main>

    <footer>Hospital Management System</footer>
</body>
</html>
