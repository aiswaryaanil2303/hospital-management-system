```html
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login | Hospital Care</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #eef6fb;
            color: #263746;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: white;
            padding: 18px 7%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        }

        .logo {
            color: #087f8c;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
        }

        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border: 1px solid #dcebf4;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(35, 90, 120, 0.08);
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e5f6f7;
            border-radius: 50%;
            color: #087f8c;
            font-size: 30px;
        }

        h1 {
            margin: 0 0 12px;
            text-align: center;
            color: #164e70;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #647f96;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 22px;
            border: 1px solid #ccd9e0;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #087f8c;
            box-shadow: 0 0 0 3px rgba(8, 127, 140, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #087f8c;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #066873;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            background: #f0f9fa;
            border-radius: 6px;
            color: #087f8c;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        footer {
            text-align: center;
            padding: 18px;
            color: #647f96;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 26px 22px;
            }

            .logo {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="/" class="logo">+ Hospital Care</a>
    </nav>

    <main class="main">
        <div class="login-box">

            <div class="icon">✉</div>

            <h1>Patient Login</h1>

            <p class="subtitle">
                Welcome back! Enter your registered email address
                to receive your OTP.
            </p>

            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}

            <form method="POST">
                {% csrf_token %}

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

                <button type="submit">Send OTP</button>
            </form>

        </div>
    </main>

    <footer>
        Your Health &nbsp; • &nbsp; Our Priority
    </footer>

</body>
</html>
```
