<h3>Available Dates & Times</h3>

{% for availability in availabilities %}

    <p>
        Date: {{ availability.date }}
        <br>
        Time: {{ availability.start_time }} - {{ availability.end_time }}
    </p>

{% empty %}

    <p>No available dates for this doctor.</p>

{% endfor %}




<h3>Book Appointment</h3>



<form method="post">
    {% csrf_token %}

    <label>Patient:</label>
    <select name="patient" required>

        <option value="">Select Patient</option>

        {% for patient in patients %}
            <option value="{{ patient.id }}">{{ patient.name }}</option>
        {% endfor %}
    </select>

    <br><br>

    <label>Available Date & Time:</label>
    <select name="availability" required>
        <option value="">Select Date & Time</option>

        {% for availability in availabilities %}
        
            <option value="{{ availability.id }}">

                {{ availability.date }} -

                {{ availability.start_time }} to {{ availability.end_time }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Reason:</label>
    <br>
    <textarea name="reason" required></textarea>

    <br><br>

    <button type="submit">Book Appointment</button>
</form>
