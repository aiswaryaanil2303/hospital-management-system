
<!DOCTYPE html>
<html>
<head>
    <title>Patient Login</title>

    <style>
        body {
            font-family: Arial;
            background: url("/static/images/patientlogin.png");
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 15px 0;
        }

        button {
            background: #087fbd;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>Patient Login</h2>

        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}

            <label>Email:</label>
            <input type="email" name="email"
                   placeholder="Enter your email" required>

            <button type="submit">Send OTP</button>
        </form>
    </div>
</body>
</html>
