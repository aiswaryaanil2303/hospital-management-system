
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Hospital Management System</title>

        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

           body {
            min-height: 100vh;
            background-image: url("{% static 'images/hospital img.jpg' %}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
        }

        nav {
            position: relative;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 25px 40px;
            background: rgba(0, 30, 60, 0.65);
        }

        .nav-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 25px;
            font-weight: bold;
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        nav a:hover {
            color: #7dd3fc;
        }

        .content {
            padding: 70px 40px;
            color: white;
            text-shadow: 1px 1px 4px black;
        }

        .content h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .content p {
            font-size: 20px;
        }

        .content h2 {
            margin-top: 20px;
        }

        .content h2 a {
            color: white;
            text-decoration: none;
        }

        .content h2 a:hover {
            color: #7dd3fc;
        }

        @media (max-width: 700px) {
            nav {
                flex-direction: column;
                gap: 20px;
                padding: 20px 10px;
            }

            .nav-title {
                position: static;
                transform: none;
                font-size: 20px;
                white-space: normal;
                text-align: center;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .content {
                padding: 45px 20px;
            }

            .content h1 {
                font-size: 30px;
            }
    }



    </style>
</head>

<body>

    <nav>
        <div class="nav-title">Hospital Management System</div>

        <div class="nav-links">

            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'category_list' %}">Patient</a>
            <a href="{% url 'doctor_list' %}">Doctor</a>
            <a href="/admin/">Admin</a>
        </div>
    </nav>

    <div class="content">


        <h1>Welcome to Our Hospital</h1>
        <p>Your health, our priority.</p>

        <h2><a href="{% url 'category_list' %}">Patient</a></h2>
        <h2><a href="{% url 'doctor_list' %}">Doctor</a></h2>
        <h2><a href="/admin/">Admin</a></h2>
    </div>

</body>
</html>
