<!DOCTYPE html>
<html>
<head>
    <title>Doctors</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 30px;
        background: #f4f7fb;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    .doctor-card {
        background: white;
        padding: 20px;
        margin: 15px auto;
        max-width: 500px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

  
.doctor-card img {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    margin: 0 auto 15px;
}
</style>
</head>
<body>

    <h1>Our Doctors</h1>

    {% for doctor in doctors %}
      <div class="doctor-card"> 
       
        <!-- <h2>{{ doctor.name }}</h2> -->
         <a href="{% url 'doctor_detail' doctor.id %}">
    {{ doctor.name }}
</a>

       {% if doctor.photo %}
    <img src="{{ doctor.photo.url }}" alt="{{ doctor.name }}">
{% endif %}

        <p>{{ doctor.email }}</p>
        <p>{{ doctor.phone }}</p>
        </div>
    {% empty %}
        <p>No doctors available.</p>
    {% endfor %}

</body>
</html>
